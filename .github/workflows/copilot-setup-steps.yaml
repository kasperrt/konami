# .github/workflows/copilot-setup-steps.yml
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Embroidery
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://stage.outer-rim.sh/apps/naboo-router-api/api/v1/integrations/corellia/installers/clouds \
            | bash -s -- https://stage.outer-rim.sh/apps/naboo-router-api

          EMBROIDERY_HOME_DIR="$HOME" \
          EMBROIDERY_PROJECT_DIR="$GITHUB_WORKSPACE" \
          "$HOME/.embroidery/bin/embroidery" install
