name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect Copilot identity metadata
        shell: bash
        env:
          COPILOT_AGENT_INPUTS: ${{ github.event.inputs.COPILOT_AGENT_INPUTS }}
        run: |
          set -euo pipefail

          printf 'github.actor=%s\n' '${{ github.actor }}'
          printf 'github.actor_id=%s\n' '${{ github.actor_id }}'
          printf 'github.triggering_actor=%s\n' '${{ github.triggering_actor }}'
          printf 'github.event.sender.login=%s\n' '${{ github.event.sender.login }}'

          if [ -z "${COPILOT_AGENT_INPUTS:-}" ]; then
            echo "COPILOT_AGENT_INPUTS is unavailable during setup"
            exit 0
          fi

          echo "Available Copilot input keys:"
          jq -r 'keys[]' <<< "$COPILOT_AGENT_INPUTS" | sort

          echo "Identity-related Copilot inputs:"
          jq -r '
            to_entries[]
            | select(.key | test("ACTOR|USER|OWNER|JOB|SESSION"; "i"))
            | select(.key | test("TOKEN|SECRET|NONCE|AUTH"; "i") | not)
            | "\(.key)=\(.value | tostring)"
          ' <<< "$COPILOT_AGENT_INPUTS"

      - name: Install and start Embroidery
        shell: bash
        env:
          EMBROIDERY_ACCESS_TOKEN: ${{ secrets.EMBROIDERY_ACCESS_TOKEN }}
          EMBROIDERY_PROVIDER: GITHUBCOPILOT
          EMBROIDERY_HOME_DIR: /home/runner
          EMBROIDERY_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if [ -z "${EMBROIDERY_ACCESS_TOKEN:-}" ]; then
            echo "EMBROIDERY_ACCESS_TOKEN was not injected"
            exit 1
          fi

          curl -fsSL \
            https://stage.outer-rim.sh/apps/naboo-router-api/api/v1/integrations/corellia/installers/clouds \
            | bash -s -- https://stage.outer-rim.sh/apps/naboo-router-api

          "$EMBROIDERY_HOME_DIR/.embroidery/bin/embroidery" headless
