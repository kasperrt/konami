name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install and start Embroidery
        shell: bash
        env:
          EMBROIDERY_PROVIDER: GITHUBCOPILOT
        run: |
          set -euo pipefail

          : "${EMBROIDERY_ACCESS_TOKEN:?EMBROIDERY_ACCESS_TOKEN must be configured as an Agents secret}"

          export EMBROIDERY_HOME_DIR="$HOME"
          export EMBROIDERY_PROJECT_DIR="$GITHUB_WORKSPACE"

          curl -fsSL \
            https://stage.outer-rim.sh/apps/naboo-router-api/api/v1/integrations/corellia/installers/clouds \
            | bash -s -- https://stage.outer-rim.sh/apps/naboo-router-api

          "$HOME/.embroidery/bin/embroidery" headless
