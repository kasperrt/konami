name: Bootstrap npm
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    if: github.repository == 'kasperrt/konami' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  bootstrap:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
      - run: npm run smoke:pack
      - name: Set the one-time prerelease version
        run: npm version 0.0.1-rc.1 --no-git-tag-version --ignore-scripts
      - name: Bootstrap npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          if npm view @kasperrt/konami@0.0.1-rc.1 version >/dev/null 2>&1; then
            echo "Bootstrap version already exists"
            exit 0
          fi
          npm publish --access public --provenance --tag next --ignore-scripts
      - name: Verify bootstrap version
        run: test "$(npm view @kasperrt/konami@0.0.1-rc.1 version)" = "0.0.1-rc.1"
